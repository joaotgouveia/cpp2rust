import os

config.support_dir = os.path.join(os.path.dirname(__file__), "util")
config.support_sources = {
    "testsuite_hooks.h": "testsuite_hooks.cc",
    "testsuite_allocator.h": "testsuite_allocator.cc",
    "testsuite_character.h": "testsuite_character.cc",
}

config.dg_default_std = "17"

config.extra_cxxflags = [
    "-I" + config.support_dir,
    "-stdlib=libstdc++",
    "-fno-exceptions",
]

config.excludes = {
    "util",
    "data",
    "lib",
    "config",
    "abi",
